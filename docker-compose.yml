services:
  api-server:
    image: ${DOCKER_IMAGE_PROD}
    container_name: flip-server-prod
    profiles: ["prod"]
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GCS_BUCKET_NAME=flip-9kdgta-bucket
    volumes:
      - ./logs:/logs
    networks:
      - flip-net

networks:
  flip-net:
    external: true
